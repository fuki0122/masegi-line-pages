{id:"iryouhi",cat:"お金",date:"2026年10月27日",title:"医療費控除とは?対象になる費用と確定申告の進め方",body:`
<p>1年間(1月〜12月)に家族みんなで払った医療費が多かった年は、確定申告をすると税金が戻ってくることがあります。これが「医療費控除」です。</p>
<h3>いくらから使える?</h3>
<p>目安は、払った医療費から、保険金などで戻ってきたお金を引いて、<b>10万円を超えた分</b>です(その年の所得が200万円未満の人は、所得の5%を超えた分)。控除できるのは最大200万円までです。</p>
<h3>対象になるもの・ならないもの</h3>
<div class="table-wrap"><table><tr><th>対象になる例</th><th>対象にならない例</th></tr>
<tr><td>病院・歯医者の診察代、入院費<br>治療のための薬代(市販薬も含む)<br>通院の電車・バス代<br>出産の費用(健診・分娩)</td><td>美容目的の施術<br>予防のための健康診断(異常がなかった場合)<br>ビタミン剤などのサプリ<br>自家用車で通院したガソリン代</td></tr></table></div>
<h3>進め方</h3>
<ul><li>家族の分もまとめて、所得が一番高い人が申告するとお得になりやすい</li><li>健康保険の「医療費のお知らせ」を使えば、明細書づくりがかんたん</li><li>会社員の還付申告は、5年前の分までさかのぼってできる</li></ul>
<p class="point">市販薬をよく買う人は「セルフメディケーション税制」(対象の薬が年1万2千円を超えた分)との選べる方を比べましょう。両方は使えません。</p>`},
{id:"shussan",cat:"お金",date:"2026年10月27日",title:"出産前後にもらえるお金と、申請先のまとめ",body:`
<p>出産のときは、もらえるお金がいくつもあります。申請しないともらえないものが多いので、先に一覧で押さえておきましょう。</p>
<div class="table-wrap"><table><tr><th>お金</th><th>内容</th><th>申請先</th></tr>

<tr><td>出産手当金</td><td>会社員などが産休中に、給料のおよそ3分の2</td><td>勤め先の健康保険</td></tr>
<tr><td>育児休業給付金</td><td>育休中に、休む前の給料の67%(半年後から50%)</td><td>勤め先を通じてハローワーク</td></tr>
<tr><td>児童手当</td><td>高校生年代まで毎月。第3子以降は月3万円</td><td>住んでいる市区町村</td></tr></table></div>
<h3>忘れやすいポイント</h3>

{id:"seiho-koujo",cat:"生命保険",date:"2026年10月27日",title:"控除証明書が届いたら確認。生命保険料控除のしくみ",body:`
<p>秋になると保険会社から届く「生命保険料控除証明書」。年末調整で出すと、所得税と住民税が少し安くなります。</p>
<h3>3つの枠がある</h3>
<p>2012年以降に入った保険は、「一般(死亡保障など)」「介護医療」「個人年金」の3つの枠に分かれます。所得税では、それぞれ最大4万円、合わせて最大12万円まで所得から引けます。</p>
<h3>枠を使い切れているか</h3>
<ul><li>医療保険しか入っていない人は、介護医療の枠しか使えていない</li><li>老後の積み立てを個人年金保険にすると、個人年金の枠も使える</li></ul>
<p class="point">控除のためだけに保険に入るのはおすすめしません。必要な保障を整えたうえで、使える枠を確かめましょう。証明書の写真を送ってもらえれば一緒に確認します。</p>`},
{id:"jitensha",cat:"損害保険",date:"2026年10月27日",title:"自転車保険に入る前に。自動車保険や火災保険の「特約」を確かめよう",body:`
<p>愛知県をはじめ、多くの都道府県で自転車の保険への加入が義務になっています。でも、新しく入る前に確かめてほしいことがあります。</p>
<h3>「個人賠償責任特約」がついていないか</h3>
<p>自転車で人にけがをさせたときの賠償は、自動車保険・火災保険・クレジットカードなどの「個人賠償責任特約」でカバーできることが多いです。この特約は、<b>一緒に住む家族全員</b>が対象になるのが一般的です。</p>
<h3>確かめる3つの点</h3>
<ul><li>補償額が無制限か、1億円以上あるか</li><li>示談交渉サービスがついているか</li><li>家族の範囲(別居の学生の子どもも入るか)</li></ul>
<p class="point">特約が重なっていると保険料のムダになります。今の証券を見ながら、どれを残すか一緒に整理しましょう。</p>`},
{id:"inflation",cat:"お金",date:"2026年10月27日",title:"値上げが続く時代の、預金だけに頼らないお金の置き方",body:`
<p>物の値段が上がると、同じ100万円で買えるものが減っていきます。銀行に置いたままでは、お金の「力」が少しずつ弱くなります。</p>
<h3>守りと攻めに分ける</h3>
<ul><li><b>守り:</b>生活費の3〜6か月分は、すぐ使える預金に</li><li><b>近い予定:</b>数年以内に使うお金(車・結婚など)は、値動きの小さいものに</li><li><b>攻め:</b>10年以上使わないお金は、NISAなどで世界に分散して長く持つ</li></ul>
<h3>NISAを使う</h3>
<p>新しいNISAは、増えた分に税金がかかりません。年に最大360万円、一生で1,800万円まで使えます。</p>
<p class="point">投資は元本が減ることもあります。何のために、いつまでに使うお金かを決めてから始めましょう。</p>`},
{id:"kougaku",cat:"医療保険",date:"2026年10月27日",title:"医療保険を考える前に知りたい「高額療養費制度」",body:`
<p>日本の健康保険には、1か月の医療費の自己負担に上限がある「高額療養費制度」があります。医療保険を選ぶ前に、まずここを知っておきましょう。</p>
<h3>上限の目安(70歳未満)</h3>
<p>年収およそ370万〜770万円の人なら、1か月の上限はおよそ8万円台です。それ以上かかっても、超えた分は戻ってきます。</p>
<h3>それでもかかるお金</h3>
<ul><li>入院中の食事代や、差額ベッド代</li><li>先進医療の技術料</li><li>働けない間に減る収入</li></ul>
<p class="point">医療保険は「制度でカバーされない部分」を補うものです。貯金でまかなえるなら、入りすぎないことも大事です。上限額は所得で変わり、見直しも議論されているので、最新の金額を確かめてください。</p>`},
{id:"shugyo",cat:"就業不能保険",date:"2026年10月27日",title:"病気やけがで働けなくなったら?収入の備えを確かめる",body:`
<p>入院費より大きくなりやすいのが、「働けない間の収入の減り」です。</p>
<h3>会社員と自営業で大きく違う</h3>
<div class="table-wrap"><table><tr><th></th><th>会社員・公務員</th><th>自営業・フリーランス</th></tr>
<tr><td>病気で休んだとき</td><td>傷病手当金で、給料のおよそ3分の2を最長1年6か月</td><td>国民健康保険には基本的にない</td></tr>
<tr><td>長く働けないとき</td><td>障害年金(障害基礎+障害厚生)</td><td>障害年金(障害基礎のみ)</td></tr></table></div>
<p class="point">自営業の人や、住宅ローンがある人は、就業不能保険を検討する価値があります。毎月の固定費から、いくら必要かを一緒に計算しましょう。</p>`},
{id:"kyouiku",cat:"教育資金",date:"2026年10月27日",title:"子どもの教育費はいくら?貯め方の3つの選択肢",body:`
<p>教育費は、幼稚園から大学まで全部公立でもおよそ1,000万円前後、私立が多いとさらに増えると言われます。一番お金がかかるのは大学の時期です。</p>
<h3>貯め方の選択肢</h3>
<ul><li><b>児童手当を使わずに貯める:</b>0歳から高校生年代まで受け取ると、合計でおよそ200万円以上になる</li><li><b>NISAで積み立てる:</b>大学まで時間があるなら、増やしながら準備できる</li><li><b>学資保険:</b>決まった時期に決まった額を受け取れる安心感がある</li></ul>
<p class="point">大学入学の時期から逆算して、「いつ・いくら」を決めると、毎月の積立額が分かります。</p>`},
{id:"kaigo",cat:"介護保険",date:"2026年10月27日",title:"40歳から払う介護保険。親の介護が始まる前に知っておくこと",body:`
<p>40歳になると、健康保険と一緒に介護保険料を払い始めます。介護が必要になったとき、介護サービスを1〜3割の負担で使えるしくみです。</p>
<h3>まず相談する先</h3>
<p>親の介護が気になったら、住んでいる地域の「地域包括支援センター」に相談します。要介護認定の申請も手伝ってもらえます。</p>
<h3>お金の準備</h3>
<ul><li>介護費用は、親自身の年金と貯金から出すのが基本</li><li>親の収入・貯金・保険を、元気なうちに家族で共有しておく</li></ul>
<p class="point">介護は突然始まることが多いです。「親のお金の棚卸し」を一度やっておくだけで、いざというとき慌てずにすみます。</p>`},
{id:"gaika",cat:"生命保険",date:"2026年10月27日",title:"外貨建て保険をすすめられたら確かめたい3つのこと",body:`
<p>ドルなど外国のお金で運用する保険は、日本の保険より利回りが高く見えることがあります。でも、入る前に確かめたいことがあります。</p>

<p class="point">「保障」と「運用」を分けて考えると、自分に合うかが見えやすくなります。すすめられた商品の資料を送ってもらえれば、中立の立場で一緒に見ます。</p>`}
